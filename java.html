<!DOCTYPE html>
<html>
  <head>
    <style>
body{
  background-color: darkslateblue;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  padding: 70px 30px ;
  margin: 0%;}
  h1{
    font-size: 35px;
    margin: 0%;
    letter-spacing: 0.5px;
  }
  .subtitle{color: #8a95b5;
    margin-top: 8px;
    font-size: 15px;
  }
  .board{
    display: flex;
    gap: 28px;
    justify-content: center;
    margin-top: 45px;
    flex-wrap: wrap;}
    .box{
      background: #1c273f;
      border: 1px solid #2e3a56;
      border-radius: 24px;
      width: 310px;
      padding: 28px 22px 26
    }
    .box h2{
      margin: 0 0 18;
      color: #c2cfe6;
      font-size: 22px;
    }
    .score{
      background: #070a1a;
      border-radius: 18px ;
      color: #ff7a7a;
      font-size: 92px;
      font-weight: 800;
      padding: 18px;
      line-height: 1;
    }
    .btns{
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }
    .btns button{
      flex: 1;
      background: #5b56e8;
      border: 0;
      color: white;
      padding: 14px 42px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      margin-top: 38px;
      cursor: pointer;
    }
    .btns button:hover{
      background: #4a46d4;
    }
    #reset{
      background: #ff3b4a;
      border: 0;
      color: white;
      padding: 14px 42px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      margin-top: 38px;
      cursor: pointer;
    }
    </style> 
  </head>
<body>

  <h1>BASKETBALL SCOREBOARD</h1>
  <div class="subtitle">click the button to add points</div>

  <div class="board">
    <div class="box">
      <h2>HOME</h2>
      <div class="score" id="home">24</div>
      <div class="btns">
        <button onclick="add('home' ,1)">+1</button>
        <button onclick="add('home' , 2)">+2</button>
        <button onclick="add('home' ,3)">+3</button>
    </div>
    </div>
    <div class="box">
      <h2>GUEST</h2>
      <DIV class="score" id="guest">18</DIV>
      <div class="btns">
        <button onclick="add('guest' ,1)">+1</button>
        <button onclick="add('guest' ,2)">+2</button>
        <button onclick="add('guest' ,3)">+3</button>
      </div>
    </div>
  </div>

  <button id="reset" onclick="reset()">reset</button>

  <script>
    // reset the home and guest button to 0 when you click on the button //
    let h=24, g=18;
    function add(team,n){
      if(team==='home'){h+=n; document.getElementById('home').innerText=h}
      if(team==='guest')else{g+n; document.getElementById('guest').innerText=g}
    }
      function reset(){
        h=0; g=0;
        document.getElementById('home').innerText=0
        document.getElementById('guest').innerText=0
      }
  </script>
</body>
</html>
